<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고교선택 가이드</title>
<meta name="description" content="학교알리미 공시로 예비고1 고교선택 설명회 자료(슬라이드·대본·학부모 배부물)를 만드는 학원용 앱">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/slides.css">
</head>
<body>
<header class="topbar no-print">
  <div class="brand">
    <span class="logo">고</span>
    <b>고교선택 가이드</b>
    <span class="muted" id="academyLabel"></span>
  </div>
  <div class="data-badge" id="dataBadge"></div>
  <button class="btn ghost" id="btnSettings" type="button">설정</button>
</header>

<div class="titlebar no-print">
  <div>
    <h1 id="eventTitle"></h1>
    <span class="muted" id="eventMeta"></span>
  </div>
  <nav class="steps" id="steps"></nav>
</div>

<main id="view"></main>

<div id="present" class="present" hidden>
  <div class="present-stage-wrap"><div class="present-stage" id="presentStage"></div></div>
  <div class="present-script" id="presentScript"></div>
  <div class="present-bar">
    <span id="presentCount"></span>
    <span class="muted">← → 넘기기 · S 대본 · F 전체화면 · Esc 나가기</span>
  </div>
</div>

<dialog id="settingsDlg">
  <form method="dialog" class="settings">
    <h2>설명회 설정</h2>
    <label>학원 이름 <input name="academy" required></label>
    <label>설명회 제목 <input name="title" required></label>
    <label>일시 <input name="date" placeholder="11월 8일 토요일 오후 2시"></label>
    <label>장소·정원 <input name="seats" placeholder="학부모 40석"></label>
    <label>상담 전화 <input name="phone" placeholder="055-000-0000"></label>
    <label>중심 과목 <input name="subject" placeholder="영어"></label>
    <div class="row-end">
      <button class="btn ghost" value="cancel" type="submit" formnovalidate>닫기</button>
      <button class="btn primary" value="ok" type="submit">저장</button>
    </div>
  </form>
</dialog>

<script src="data/schools.js"></script>
<script src="data/plans.js"></script>
<script src="js/demo.js"></script>
<script src="js/core.js"></script>
<script src="js/slides.js"></script>
<script src="js/app.js"></script>
</body>
</html>
